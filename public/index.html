<!DOCTYPE html>
<!-- FRONT END: HTML định nghĩa CẤU TRÚC của trang -->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Việc cần làm</title>
  <!-- CSS định nghĩa GIAO DIỆN -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Việc cần làm</h1>

    <!-- Form thêm việc mới -->
    <form id="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="Bạn cần làm gì hôm nay?"
        autocomplete="off"
        required
      />
      <button type="submit">Thêm</button>
    </form>

    <!-- Danh sách việc: JavaScript sẽ đổ dữ liệu vào đây -->
    <ul id="todo-list"></ul>

    <p id="empty-msg" hidden>Chưa có việc nào. Hãy thêm việc đầu tiên!</p>
  </main>

  <!-- JavaScript định nghĩa HÀNH VI (logic phía trình duyệt) -->
  <script src="script.js"></script>
</body>
</html>
